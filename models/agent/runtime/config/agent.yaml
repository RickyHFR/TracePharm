max_total_tokens: 120000
deadline_seconds: 300
retain_tool_pairs_k: -1
tool_deepseek_chat_max_workers: 4

enable_reflection: true
enable_rec_debate: true
debate_max_rounds: 2
debate_max_retrievals: 2
