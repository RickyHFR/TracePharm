# unified agent runtime configuration
max_rounds: 8
max_tools_per_turn: 2
planner_max_tools_per_turn: 0
enable_tools: true
strict_tool_registry: true
enable_planner: true
enable_visible_planner_fallback: true
enable_goal_guidance: true
max_tool_turns: 3
max_total_tool_calls: 5
max_online_tool_calls: 4
max_local_tool_calls: 2
